name: Maak toegangslink

on:
  workflow_dispatch:
    inputs:
      naam:
        description: 'Naam van de bezoeker'
        required: true
      dagen:
        description: 'Aantal dagen geldig'
        required: true
        default: '14'
      pad:
        description: 'Pagina'
        required: true
        default: '/inwarmte/'
        type: choice
        options:
          - /inwarmte/
          - /projectorganisaties/
      domein:
        description: 'Domein'
        required: true
        default: 'https://framework.benable.nl'
        type: choice
        options:
          - https://framework.benable.nl
          - https://benable-framework.pages.dev

permissions:
  contents: write

concurrency:
  group: toegang
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Link maken
        env:
          LINK_SECRET: ${{ secrets.LINK_SECRET }}
          NAAM: ${{ inputs.naam }}
          DAGEN: ${{ inputs.dagen }}
          PAD: ${{ inputs.pad }}
          DOMEIN: ${{ inputs.domein }}
        run: |
          OUT=$(node scripts/maak-link.mjs --naam "$NAAM" --dagen "$DAGEN" --pad "$PAD" --domein "$DOMEIN")
          ID=$(echo "$OUT" | grep -o 'id [0-9a-f]\{8\}' | cut -d' ' -f2)
          TOT=$(date -u -d "+${DAGEN} days" +%d-%m-%Y)
          VANDAAG=$(date -u +%d-%m-%Y)
          SCHOON=$(echo "$NAAM" | tr -d '|\n')
          echo "| $VANDAAG | $SCHOON | $PAD | $TOT | $ID | actief |" >> toegang/links.md
          {
            echo "## Toegangslink"
            echo '```'
            echo "$OUT"
            echo '```'
            echo "Kopieer de regel die met https begint en stuur die naar de bezoeker."
            echo "Intrekken: Actions → **Trek toegangslink in** → id \`$ID\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Overzicht bijwerken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toegang/links.md
          git commit -m "Toegangslink uitgegeven [CF-Pages-Skip]"
          git push
